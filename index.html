<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rotina Familiar</title>
<style id="tema"></style>
<style>
  .barra { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
           gap: 10px; padding: 8px 12px; margin: -16px -16px 12px; background: #2f6f6aee; color: #fff;
           font: 600 14px "Segoe UI", Arial, sans-serif; backdrop-filter: blur(4px); }
  .barra button { background: #fff; color: #2f6f6a; border: 0; border-radius: 20px; padding: 7px 16px;
                  font: 700 14px inherit; cursor: pointer; }
  .barra button:disabled { opacity: .6; cursor: wait; }
  .barra .st { font-weight: 400; font-size: 12px; opacity: .9; }
  .erro { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; font-family: Arial, sans-serif; }
  @media print { .barra { display: none; } }
</style>
</head>
<body>
<div class="barra">
  <span>🏡 Rotina Familiar <span class="st" id="st"></span></span>
  <button id="btn" type="button">Atualizar</button>
</div>
<div id="conteudo">Carregando…</div>

<script>
// Fonte do conteúdo: o arquivo rotina.html neste repositório do GitHub
const REPO = "ATOSMOREIRA/rotina-familiar";
const ARQUIVO = "rotina.html";

async function buscar() {
  // 1) API do GitHub: sempre a versão mais recente da branch padrão
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${ARQUIVO}`, {
      headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store" });
    if (r.ok) return await r.text();
  } catch (_) {}
  // 2) Alternativa: arquivo ao lado desta página (GitHub Pages), sem cache
  const r2 = await fetch(`${ARQUIVO}?t=${Date.now()}`, { cache: "no-store" });
  if (!r2.ok) throw new Error("Não foi possível carregar " + ARQUIVO);
  return await r2.text();
}

async function atualizar() {
  const btn = document.getElementById("btn"), st = document.getElementById("st");
  btn.disabled = true; st.textContent = "· atualizando…";
  try {
    const doc = new DOMParser().parseFromString(await buscar(), "text/html");
    document.getElementById("tema").textContent =
      [...doc.querySelectorAll("style")].map(s => s.textContent).join("\n");
    const box = document.getElementById("conteudo");
    box.innerHTML = doc.body.innerHTML;
    // innerHTML não executa <script>: recria os scripts do conteúdo (ex.: calendário automático)
    box.querySelectorAll("script").forEach(old => {
      const novo = document.createElement("script");
      novo.textContent = old.textContent; old.replaceWith(novo);
    });
    st.textContent = "· atualizado às " + new Date().toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
  } catch (e) {
    document.getElementById("conteudo").innerHTML = `<div class="erro">${e.message}</div>`;
    st.textContent = "· falha ao atualizar";
  } finally { btn.disabled = false; }
}

document.getElementById("btn").addEventListener("click", atualizar);
atualizar();
</script>
</body>
</html>
